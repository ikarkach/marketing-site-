name: Deploy to Selectel S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selectel
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      S3_ACCESS_KEY: ${{ secrets.SELECTEL_S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.SELECTEL_S3_SECRET_KEY }}
      S3_BUCKET: ${{ secrets.SELECTEL_S3_BUCKET }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ] || [ -z "$S3_BUCKET" ]; then
            echo "::warning::Secrets SELECTEL_S3_ACCESS_KEY, SELECTEL_S3_SECRET_KEY, SELECTEL_S3_BUCKET are not set - deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Hugo (extended)
        if: steps.check.outputs.ready == 'true'
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install theme dependencies (PostCSS)
        if: steps.check.outputs.ready == 'true'
        working-directory: themes/introduction
        run: npm ci --ignore-scripts

      - name: Build site
        if: steps.check.outputs.ready == 'true'
        env:
          HUGO_ENVIRONMENT: production
        run: |
          export PATH="$PWD/themes/introduction/node_modules/.bin:$PATH"
          hugo --gc --minify

      - name: Check that no link points to the domain without www
        if: steps.check.outputs.ready == 'true'
        run: |
          if grep -rIEn '(https?:)?//usplitonline\.ru' public; then
            echo "::error::Found links to usplitonline.ru without www"
            exit 1
          fi

      - name: Install s3cmd
        if: steps.check.outputs.ready == 'true'
        run: pip install s3cmd

      - name: Configure s3cmd for Selectel (ru-1)
        if: steps.check.outputs.ready == 'true'
        run: |
          umask 077
          {
            echo "[default]"
            echo "access_key = ${S3_ACCESS_KEY}"
            echo "secret_key = ${S3_SECRET_KEY}"
            echo "host_base = s3.ru-1.storage.selcloud.ru"
            echo "host_bucket = %(bucket)s.s3.ru-1.storage.selcloud.ru"
            echo "bucket_location = ru-1"
            echo "use_https = true"
            echo "signature_v2 = false"
          } > "$HOME/.s3cfg"

      - name: Upload to bucket
        if: steps.check.outputs.ready == 'true'
        run: |
          # 1) Загружаем всё новое и изменённое, ничего не удаляя. Старые css/js/картинки с хэшем в имени остаются:
          #    CDN и браузеры держат HTML до суток, и закешированная страница должна находить свои стили (иначе страница без оформления).
          s3cmd sync --acl-public --no-progress --guess-mime-type public/ "s3://${S3_BUCKET}/"
          # 2) Удаляем из бакета только удалённые страницы и файлы, а css/js/fonts/обработанные картинки (имена с хэшем) не трогаем.
          s3cmd sync --acl-public --delete-removed --no-progress --guess-mime-type \
            --exclude 'css/*' --exclude 'js/*' --exclude 'fonts/*' --exclude '*_hu_*' \
            public/ "s3://${S3_BUCKET}/"

      - name: Set correct Content-Type for CSS
        if: steps.check.outputs.ready == 'true'
        run: |
          # s3cmd (через python-magic) определяет .css как text/plain, и Safari/Chrome не применяют такие стили:
          # страницы выглядят без оформления. Перезаливаем все .css с правильным типом при каждом деплое
          # (sync не обновляет файлы, у которых изменился только тип).
          find public -type f -name '*.css' -print0 | while IFS= read -r -d '' f; do
            s3cmd put --acl-public --no-progress --no-guess-mime-type --mime-type="text/css" "$f" "s3://${S3_BUCKET}/${f#public/}"
          done

