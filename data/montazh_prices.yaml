# Цены на монтаж — единственный источник: таблицы на странице /montazh/ (layouts/montazh/single.html),
# разметка Service (JSON-LD) и строка «Монтаж — от … ₽» на карточках кондиционеров (partials/series-card.html).
#
# Поля строки: id (для ссылок), name, power (типоразмер), area (ориентир по площади), price (₽),
#   from: true — цена «от», unit — «₽/м», «₽/г» (по умолчанию ₽),
#   utochnit: "…" — строка НЕ выводится ни на странице, ни в разметке, пока поле не удалено (нужно уточнить цену или формулировку).
updated: "октябрь 2026"

# какая строка даёт цену «Монтаж — от …» на карточках серий по типу оборудования (wall, semi; для остальных типов строки нет)
cards:
  wall: split-07-09
  semi: semi

groups:
  - id: split
    title: "Монтаж бытовых сплит-систем"
    columns: ["Тип", "Мощность", "Для помещения (ориентир)", "Стандартный монтаж"]
    note: "Площадь указана ориентировочно; точную мощность подбираем по расчёту теплопритоков."
    rows:
      - {id: split-07-09, name: "Настенная сплит-система", power: "07–09", area: "до 25 м²", price: 7000}
      - {id: split-12, name: "Настенная сплит-система", power: "12", area: "до 35 м²", price: 8000}
      - {id: split-18, name: "Настенная сплит-система", power: "18", area: "до 50 м²", price: 9000}
      - {id: split-24, name: "Настенная сплит-система", power: "24 и выше", area: "от 60 м²", price: 12000}
      - {id: semi, name: "Полупромышленная (кассетная, канальная, напольно-потолочная)", power: "—", area: "—", price: 15000, from: true}

  - id: multi
    title: "Монтаж мульти-сплит систем"
    rows:
      - {id: multi-extra, name: "Установка дополнительного внутреннего блока", price: 4000}

  - id: vrf
    title: "Монтаж VRF-систем (двухтрубных)"
    rows:
      - {id: vrf-out, name: "Наружный блок VRF: монтаж, опрессовка, заправка, пусконаладка", price: 50000}
      - {id: vrf-in, name: "Внутренний настенный блок VRF", price: 5000, from: true}

  - id: naveska
    title: "Навеска кондиционера на готовую трассу"
    rows:
      - {id: nav-07-09, name: "Мощность 07–09", price: 6000}
      - {id: nav-12-18, name: "Мощность 12–18", price: 7000}
      - {id: nav-24, name: "Мощность 24", price: 8000}

  - id: extra
    title: "Дополнительные работы"
    rows:
      - {id: trassa-07-12, name: "Прокладка межблочной трассы для 07–12", price: 2200, unit: "₽/м"}
      - {id: trassa-18, name: "Прокладка межблочной трассы для 18", price: 3000, unit: "₽/м"}
      - {id: trassa-24, name: "Прокладка межблочной трассы для 24", price: 3500, unit: "₽/м"}
      - {id: shtrob-gazoblok, name: "Штробление: газоблок", price: 1000, unit: "₽/м", utochnit: "цена за погонный метр или за что-то другое"}
      - {id: shtrob-kirpich, name: "Штробление: кирпич", price: 1200, unit: "₽/м", utochnit: "цена за погонный метр или за что-то другое"}
      - {id: shtrob-beton, name: "Штробление: бетон", price: 1500, unit: "₽/м", utochnit: "цена за погонный метр или за что-то другое"}
      - {id: burenie, name: "Дополнительное отверстие (бурение)", price: 1000, from: true}
      - {id: vysota, name: "Высотные (альпинистские) работы", price: 7000, from: true}
      - {id: freon, name: "Заправка фреоном", price: 8, from: true, unit: "₽/г"}
      - {id: utechka, name: "Поиск утечки, дефектовка", price: 3000, from: true}
      - {id: demontazh, name: "Демонтаж кондиционера", price: 3000, from: true}
      - {id: perenos, name: "Перенос кондиционера (демонтаж + монтаж)", price: 4000, from: true, utochnit: "перенос дешевле стандартного монтажа — верно ли?"}
