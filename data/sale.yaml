# Раздел «Распродажа» (/projects/rasprodazha/). Пока товаров нет: страница показывает заглушку и закрыта от индексации.
# Как добавить товары — docs/sale.md. Коротко:
#   1. Допишите позиции в список items ниже (пример в комментарии).
#   2. Фото (WebP) положите в content/projects/rasprodazha/ и укажите имя файла в image.
#   3. В content/projects/rasprodazha/_index.md удалите строки noindex и sitemap (раздел появится в поиске и sitemap.xml).
#
# ВАЖНО: публикуем только розничные цены (РРЦ). Дилерские и специальные цены в репозиторий не добавлять: он публичный.
#
# Поля позиции:
#   title     название (обязательно)
#   brand     бренд (необязательно)
#   price     цена распродажи, ₽ (если не указана, покажется «Цена по запросу»)
#   oldPrice  прежняя цена, ₽ (зачёркнутая; скидка в процентах считается сама)
#   note      короткая пометка («витринный образец», «остаток на складе»)
#   image     имя файла фото рядом с _index.md
#   url       ссылка на страницу товара/серии (если нет, по клику откроется окно заявки)
#
# items:
#   - title: "Hisense Goal 2.0 AS-07UW4RYRKJ00 (витринный образец)"
#     brand: Hisense
#     price: 24990
#     oldPrice: 27490
#     note: Витринный образец
#     image: goal-sale.webp
#     url: /projects/hisense-nastennye/goal-2-0/
items: []
