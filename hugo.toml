# Единственный источник базового адреса сайта. Только с www: адрес без www не работает (404).
baseURL = 'https://www.usplitonline.ru/'
locale = 'ru-RU'
title = 'Usplit'
theme = 'introduction'

# robots.txt собирается шаблоном layouts/robots.txt, адрес sitemap берётся из baseURL
enableRobotsTXT = true
# lastmod в sitemap.xml берётся из даты последнего коммита файла
enableGitInfo = true
# служебные страницы тегов не нужны: тонкий контент, в sitemap не попадают
disableKinds = ['taxonomy', 'term']

[params]
  themeStyle    = "light"                                  # только светлая тема: тёмная (auto) давала чёрный фон страниц
  showMenu      = true
  fadeIn        = true
  favicon       = "favicon.png"
  customCSS     = ["css/site.css", "css/ui.css"]
  customJS      = ["js/nav.js", "js/lead.js", "js/copylink.js"]                            # главное меню (выпадающие списки, бургер)
  dateFormat    = "2 January 2006"
  email         = "karkachev2010@yandex.ru"
  description   = "Продажа, монтаж и сервисное обслуживание кондиционеров и вентиляции"

  # --- Аналитика и подтверждение прав (эти ключи должны стоять здесь, выше любых [params.*]) ---
  # Права подтверждены файлами в static/ (google71ba5704b50e20cb.html, yandex_127c5b3560824f5b.html), не удаляйте их.
  # Мета-теги подтверждения нужны только как запасной способ: раскомментируйте и впишите значение content, тег появится на всех страницах.
  yandexVerification = "127c5b3560824f5b"   # Яндекс.Вебмастер → Права доступа → «Мета-тег» → значение content
  # googleVerification = ""   # Search Console → Настройки → Подтверждение права → «Метатег» → значение content
  yandexMetrika      = 113383403                # номер счётчика Яндекс.Метрики (код счётчика собирается шаблоном layouts/partials/head/analytics.html)

  [params.home]
    introHeight            = "fullheight"
    showLatest             = true
    showAllPosts           = false
    numberOfProjectsToShow = 3

  # Данные компании для JSON-LD (HVACBusiness) и подвала. Только то, что указано на сайте.
  [params.business]
    name          = "Usplit"
    city          = "Краснодар"
    country       = "RU"
    region        = "Краснодарский край"
    streetAddress = "ул. Лизы Чайкиной, 4/1"
    addressText   = "г. Краснодар, ул. Лизы Чайкиной, 4/1"   # так адрес пишется везде на сайте (подвал, «Контакты»)
    openingHours  = ["Mo-Fr 09:00-17:00"]                    # для разметки; выходные по предварительной записи
    hoursText     = "Пн–Пт с 9:00 до 17:00, в выходные по предварительной записи"
    # TODO: почтовый индекс не указан, впишите, когда узнаете (пустое значение в разметку не попадает):
    postalCode    = ""

  # Контакты для кнопок связи (единый компонент layouts/partials/contact-buttons.html)
  [params.contact]
    phoneDisplay = "8 (960) 477-71-14"           # как телефон выводится на сайте (то же, что в разделе «Контакты»)
    phone        = "+79604777114"                # ссылка tel:
    whatsapp     = "79604777114"                 # https://wa.me/<номер без +>
    telegram     = "+79604777114"                # https://t.me/<номер с + или имя пользователя>
    max          = "https://max.ru/u/f9LHodD0cOLi2m8ObHAzmKK0CEbdvwbTKNkPch3A4ED34-iTmpeHDKa6Chw"   # ссылка на профиль в MAX (кнопка не выводится, если пусто)
    whatsappText = "Здравствуйте! Хочу получить консультацию по климатической технике."

  [params.projects]
    useTwoColumns = true

  [params.share]
    twitter   = false
    facebook  = false
    pinterest = false

  [[params.social]]
    url       = "mailto:karkachev2010@yandex.ru"
    icon      = "paper-plane"
    icon_pack = "fas"
  [[params.social]]
    url       = "tel:+79604777114"
    icon      = "phone"
    icon_pack = "fas"
  [[params.social]]
    url       = "https://wa.me/79604777114"
    icon      = "whatsapp"
    icon_pack = "fab"
  [[params.social]]
    url       = "https://t.me/+79604777114"
    icon      = "telegram"
    icon_pack = "fab"

[taxonomies]
  tag = "tags"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences  = true
    guessSyntax = false
    style       = "solarized-dark"
    tabWidth    = 4

# Сжатие HTML оставляет кавычки у атрибутов: проверка метатега Яндекс.Вебмастера не находила <meta name=yandex-verification ...> без кавычек
[minify.tdewolff.html]
  keepQuotes = true
