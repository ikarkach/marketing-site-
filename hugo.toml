baseURL = 'https://example.org/'
locale = 'ru-RU'
title = 'КлиматСервис'
theme = 'introduction'

[params]
  themeStyle    = "auto"                                   # "light", "dark" или "auto"
  showMenu      = true
  fadeIn        = true
  dateFormat    = "2 January 2006"
  email         = "info@climat-service.ru"
  description   = "Продажа, монтаж и сервисное обслуживание кондиционеров и вентиляции"

  [params.home]
    introHeight            = "fullheight"
    showLatest             = true
    showAllPosts           = false
    numberOfProjectsToShow = 3

  [params.projects]
    useTwoColumns = true

  [params.share]
    twitter   = false
    facebook  = false
    pinterest = false

  [[params.social]]
    url       = "mailto:info@climat-service.ru"
    icon      = "paper-plane"
    icon_pack = "fas"
  [[params.social]]
    url       = "tel:+70000000000"
    icon      = "phone"
    icon_pack = "fas"

[taxonomies]
  tag = "tags"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences  = true
    guessSyntax = false
    style       = "solarized-dark"
    tabWidth    = 4
