{{- /* Подтверждение прав и Яндекс.Метрика. Значения задаются в hugo.toml, [params]; пока не заданы, ничего не выводится. */ -}}
{{- with site.Params.yandexVerification }}
<meta name="yandex-verification" content="{{ . }}">
{{- end }}
{{- with site.Params.googleVerification }}
<meta name="google-site-verification" content="{{ . }}">
{{- end }}
{{- with site.Params.yandexMetrika }}
<!-- Yandex.Metrika counter -->
<script>
(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
m[i].l=1*new Date();
for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
ym({{ int . }}, "init", { clickmap: true, trackLinks: true, accurateTrackBounce: true, webvisor: true });
// Цели: клики по кнопкам связи (call_click, whatsapp_click, telegram_click)
document.addEventListener("click", function (ev) {
  var el = ev.target.closest && ev.target.closest("[data-goal]");
  if (el && window.ym) { ym({{ int . }}, "reachGoal", el.getAttribute("data-goal")); }
});
</script>
<!-- /Yandex.Metrika counter -->
{{- end }}
